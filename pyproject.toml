[project]
name = "long-long-agent"
version = "0.1.0"
description = "RWKV-7 agent-only data preparation and latent-reasoning experiments"
requires-python = ">=3.11,<3.13"
dependencies = [
  "huggingface-hub>=1.0,<2",
  "pyarrow>=20,<24",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "jsonschema>=4,<5",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
