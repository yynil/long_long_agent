    implementation: src.training.token_budget_sampler.TokenBudgetPackSampler
    algorithm: seeded_bucket_best_fit_decreasing
    seed: 20260904
    bucket_size: 2048
    shuffle: true
    distributed_partition: disjoint_row_striping
    distributed_tail: drop_global_tail_rows
    set_epoch_required: true
    sequence_contract: independent_reset_decisions_only
