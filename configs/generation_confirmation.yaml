  - id: stream_decoder
    task: "Repair a streaming decoder that receives a multibyte character across two chunks. Preserve incomplete bytes until the next chunk; reject malformed final input. Add regression tests without changing the public API."
    continuation: 'Assistant: I will reproduce the split-byte case and the malformed final buffer case. <tool_call>{"name":"execute","arguments":{"command":"pytest -q tests/test_stream_decoder.py"}}</tool_call>'
  - id: migration_rollback
    task: "Repair a configuration migration so a failed validation rolls back all changes. Preserve unknown extension keys and prove a second successful migration is idempotent."
    continuation: 'Assistant: I will inspect the transaction boundary and verify rollback and idempotence. <tool_call>{"name":"execute","arguments":{"command":"pytest -q tests/test_migration_rollback.py"}}</tool_call>'
